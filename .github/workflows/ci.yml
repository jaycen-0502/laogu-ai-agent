name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r server/requirements.txt pytest psutil websocket-client
      - run: python -m compileall -q agent common desktop server tests
      - run: python -m pytest tests/test_remote_license.py tests/test_security_hardening.py -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  browser-go:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: browser/go.mod
          cache-dependency-path: browser/go.sum
      - run: go test ./backend/...

  browser-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: browser/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r desktop/requirements.txt pytest
      - run: python -m pytest desktop/tests -q
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build_portable.ps1 -Clean
